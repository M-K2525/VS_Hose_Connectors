plugins {
    id 'eclipse'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.140'
}

version = '0.2.0-1.21.1'
group = 'com.mk2525.vsfluidlink'
archivesBaseName = 'VS-Sable-HoseConnectors'

java {
    toolchain {
        languageVersion.set(JavaLanguageVersion.of(21))
    }
}

compileJava {
    options.encoding = 'UTF-8'
}

neoForge {
    version = project.neoforge_version

    runs {
        client {
            client()
        }

        server {
            server()
        }
    }

    mods {
        vsfluidlink {
            sourceSet sourceSets.main
        }
    }

    unitTest {
        enable()
        testedMod = mods.vsfluidlink
    }
}

repositories {
    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    maven { url = 'https://maven.architectury.dev' }
    maven {
        url = 'https://maven.squiddev.cc'
        content { includeGroup 'cc.tweaked' }
    }
    mavenCentral()
    maven { url = "https://maven.createmod.net" } // Create, Ponder, Flywheel
    maven { url = "https://maven.ithundxr.dev/snapshots" } // Registrate
    maven {
        name = 'tterrag maven'
        url = 'https://maven.tterrag.com/'
    }
    maven {
        url "https://www.cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    // Create, Ponder, Registrate
    maven { url = "https://maven.tterrag.com/" }
    maven { url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/" }
}

dependencies {
    // Pin the NeoForge 1.21.1 release ID: "0.6.2" also names a Forge 1.20.1 artifact.
    compileOnly 'maven.modrinth:power-grid:jCkPHjmP'
    testImplementation 'maven.modrinth:power-grid:jCkPHjmP'
    testImplementation 'org.ejml:ejml-simple:0.44.0'
    if (providers.gradleProperty('withPowerGrid').map { it.toBoolean() }.getOrElse(false)) {
        runtimeOnly 'maven.modrinth:power-grid:jCkPHjmP'
        runtimeOnly 'dev.architectury:architectury-neoforge:13.0.8'
    }
    compileOnly 'cc.tweaked:cc-tweaked-1.21.1-forge-api:1.120.2'
    testImplementation 'cc.tweaked:cc-tweaked-1.21.1-forge-api:1.120.2'
    if (providers.gradleProperty('withComputerCraft').map { it.toBoolean() }.getOrElse(false)) {
        runtimeOnly 'cc.tweaked:cc-tweaked-1.21.1-forge:1.120.2'
    }
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testImplementation 'org.mockito:mockito-core:5.14.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
    // Create for NeoForge 1.21.1
    // 以前の差分で libs 内の jar を参照していたため、それに合わせます
    implementation files('libs/create-1.21.1-6.0.9.jar')
    implementation("net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}")
    compileOnly("dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}")
    runtimeOnly("dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}")
    implementation("com.tterrag.registrate:Registrate:${registrate_version}")
    
    // 他に必要な依存関係があればここに追加
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = archivesBaseName
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/local-maven"
        }
    }
}

jar {
    manifest {
        attributes([
                "Specification-Title"     : "vsHoseConnector",
                "Specification-Vendor"    : "mk2525",
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.jar.archiveVersion,
                "Implementation-Vendor"   : "mk2525",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

test {
    useJUnitPlatform()
    systemProperty 'withComputerCraft', providers.gradleProperty('withComputerCraft').getOrElse('false')
    exclude '**/compat/powergrid/**'
    if (!providers.gradleProperty('withPowerGrid').map { it.toBoolean() }.getOrElse(false)) {
        classpath = sourceSets.test.runtimeClasspath.filter { !it.name.startsWith('power-grid-') }
    }
}

// PG's simulation API and Minecraft types must use a single loader in unit tests.
tasks.register('powerGridTest', Test) {
    useJUnitPlatform()
    workingDir = layout.buildDirectory.dir('powergrid-test-run').get().asFile
    doFirst { workingDir.mkdirs() }
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath.filter { !it.name.startsWith('junit-fml-') }
    include '**/compat/powergrid/**'
}
tasks.named('check') { dependsOn 'powerGridTest' }
